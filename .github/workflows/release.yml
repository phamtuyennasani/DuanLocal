name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

defaults:
  run:
    working-directory: devstack

jobs:
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devstack
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Package macOS
        run: ./scripts/package-macos.sh
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: devstack-macos-arm64
          path: devstack/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devstack
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version '^2' --locked
      - name: Package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: devstack-windows-x64
          path: |
            devstack/target/release/bundle/nsis/*.exe
            devstack/target/release/bundle/nsis/*.sha256
          if-no-files-found: error

  publish:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes dist/*
